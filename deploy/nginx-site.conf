# nginx site for Eco-Master on a server that already runs nginx. install-behind-nginx.sh
# fills in DOMAIN_NAME and WEB_PORT; certbot then adds HTTPS and the redirect from HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_NAME;

    # Market photos may be up to 8 MB before the server shrinks them.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:WEB_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
